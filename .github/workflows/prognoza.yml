name: Prognoza pogody Stories

on:
  schedule:
    # Render zaraz po północy w Warszawie; publikację Metricool planuje na PUBLISH.time (06:00).
    # GitHub potrafi spóźnić harmonogram o kilka godzin, więc są zapasowe terminy.
    # Publikuje pierwszy przebieg po północy; kolejne widzą, że dziś już poszło, i się pomijają.
    - cron: "1 22 * * *"
    - cron: "1 23 * * *"
    - cron: "1 1 * * *"
    - cron: "1 3 * * *"
    - cron: "1 5 * * *"
  workflow_dispatch:
    inputs:
      mock:
        description: "Dane testowe (zima/lato/burza/mgla) – puste = prawdziwa prognoza"
        required: false
        default: ""
      date:
        description: "Data prognozy RRRR-MM-DD (puste = dziś)"
        required: false
        default: ""
      lektor_url:
        description: "Gotowe nagranie lektora (https://…mp3) – puste = generuj z ElevenLabs, jeśli jest klucz"
        required: false
        default: ""
      lektor_cta_url:
        description: "Gotowe nagranie CTA (https://…mp3)"
        required: false
        default: ""
      metricool:
        description: "Wysłać do Metricool? (tak/nie)"
        required: false
        default: "tak"

concurrency: prognoza

permissions:
  contents: write

jobs:
  prognoza:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Europe/Warsaw
    steps:
      - name: Czy dzisiejsza prognoza już poszła?
        id: guard
        env:
          GH_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || github.token }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> $GITHUB_OUTPUT; exit 0; fi
          H=$(TZ=Europe/Warsaw date +%H); D=$(TZ=Europe/Warsaw date +%F)
          if [ "$H" -ge 12 ]; then
            echo "W Warszawie jest $H:xx (przed północą) – czekam na kolejny termin."
            echo "run=false" >> $GITHUB_OUTPUT; exit 0
          fi
          if gh release list --repo "$MEDIA_REPO" --limit 30 --json tagName --jq '.[].tagName' | grep -q "^prognoza-$D-"; then
            echo "Prognoza na $D już opublikowana – pomijam."
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "Publikuję prognozę na $D (godz. $H w Warszawie)."
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Instalacja
        if: steps.guard.outputs.run == 'true'
        run: npm ci && npx remotion browser ensure

      - name: Sponsor pogody (arkusz Google / harmonogram w repo)
        if: steps.guard.outputs.run == 'true'
        env:
          SPONSOR_SHEET_ID: ${{ vars.SPONSOR_SHEET_ID || '150ARmkz7CAIWw6djW2-YHjYSfD2SmuIV3bBNS9M9WIw' }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.date }}" ]; then EXTRA="--date ${{ github.event.inputs.date }}"; fi
          npx tsx scripts/sponsor.ts $EXTRA

      - name: Pobranie prognozy
        if: steps.guard.outputs.run == 'true'
        run: |
          # MET Norway prosi, by nie odpytywać wszyscy równo o pełnej minucie
          if [ "${{ github.event_name }}" = "schedule" ]; then sleep $((RANDOM % 90)); fi
          EXTRA=""
          if [ -n "${{ github.event.inputs.date }}" ]; then EXTRA="--date ${{ github.event.inputs.date }}"; fi
          if [ -n "${{ github.event.inputs.mock }}" ]; then
            npx tsx scripts/fetch-forecast.ts --mock "${{ github.event.inputs.mock }}" $EXTRA
          else
            npx tsx scripts/fetch-forecast.ts $EXTRA
          fi

      - name: Lektor (ElevenLabs)
        if: steps.guard.outputs.run == 'true' && github.event.inputs.mock == ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LEKTOR_URL: ${{ github.event.inputs.lektor_url }}
          LEKTOR_CTA_URL: ${{ github.event.inputs.lektor_cta_url }}
        run: npx tsx scripts/lektor.ts

      - name: Render wideo
        if: steps.guard.outputs.run == 'true'
        # wersja 2: plansza + mapa 3D (WebGL bez karty graficznej = --gl=swangle, render ok. 1–2 h)
        run: npx remotion render PrognozaMapa out/prognoza.mp4 --props=public/data/forecast.json --codec=h264 --crf=20 --gl=swangle --concurrency=2 --timeout=240000

      - name: Zapis wideo jako artefakt (do podglądu)
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prognoza-${{ github.run_id }}
          path: |
            out/prognoza.mp4
            public/data/forecast.json
          retention-days: 14

      - name: Publiczny link do wideo (GitHub Release)
        # Metricool pobiera wideo z publicznego adresu. Repozytorium z filmami (MEDIA_REPO) musi być publiczne.
        id: media
        if: steps.guard.outputs.run == 'true' && vars.METRICOOL_ENABLED == 'true' && github.event.inputs.metricool != 'nie'
        env:
          GH_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || github.token }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || github.repository }}
        run: |
          D=$(node -e "console.log(require('./public/data/forecast.json').date)")
          TAG="prognoza-$D-${{ github.run_id }}"
          cp out/prognoza.mp4 "out/prognoza-$D.mp4"
          gh release create "$TAG" "out/prognoza-$D.mp4" --repo "$MEDIA_REPO" --title "Prognoza $D" --notes "auto" --latest=false
          echo "url=https://github.com/$MEDIA_REPO/releases/download/$TAG/prognoza-$D.mp4" >> $GITHUB_OUTPUT
          # sprzątanie: filmy starsze niż 7 dni
          gh release list --repo "$MEDIA_REPO" --limit 100 --json tagName,createdAt \
            --jq '.[] | select(.tagName|startswith("prognoza-")) | select((now - (.createdAt|fromdate)) > 604800) | .tagName' \
            | xargs -r -n1 gh release delete --repo "$MEDIA_REPO" --cleanup-tag -y

      - name: Metricool – szkic albo publikacja
        # Włączenie: Variables → METRICOOL_ENABLED = true; Secrets → METRICOOL_USER_TOKEN;
        # Variables → METRICOOL_MODE = draft (szkic do zatwierdzenia) albo publish
        if: steps.guard.outputs.run == 'true' && vars.METRICOOL_ENABLED == 'true' && github.event.inputs.mock == '' && github.event.inputs.metricool != 'nie'
        env:
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ vars.METRICOOL_USER_ID || '5428059' }}
          METRICOOL_BLOG_ID: ${{ vars.METRICOOL_BLOG_ID || '7029617' }}
          # publish = publikacja automatyczna; zmień na draft, żeby wrócić do szkiców do zatwierdzenia
          METRICOOL_MODE: publish
        run: npx tsx scripts/publish-metricool.ts "${{ steps.media.outputs.url }}"
